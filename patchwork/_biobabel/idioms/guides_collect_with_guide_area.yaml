id: patchwork.guides_collect_with_guide_area
name: Collect duplicate legends into one shared, explicitly placed cell
description: >
  plot_layout(guides="collect") deduplicates structurally-identical legends
  across panels into one; adding guide_area() gives that collected legend
  an explicit cell to render into instead of an implicit shared edge.
code_template: |
  # p1, p2, p3 are ggplot2_py.GGPlot objects sharing a colour scale.
  # import patchwork as pw first.
  composed = p1 + p2 + p3 + pw.guide_area() + pw.plot_layout(guides="collect")
typical_use_case: "Several plots sharing one colour/fill legend that should be shown once, in a chosen spot, instead of repeated on every panel."
applicable_to:
  - patchwork.guide_axis_collection
