id: patchwork.stack_vertical
name: Stack two plots vertically with /
description: >
  / is shorthand for + followed by plot_layout(ncol=1) — the simplest way
  to place one plot directly above another.
code_template: |
  # p1, p2 are ggplot2_py.GGPlot objects; import patchwork as pw first.
  stacked = p1 / p2
typical_use_case: "Two related plots that should read top-to-bottom, e.g. a time series above its residuals."
applicable_to:
  - patchwork.operator_grammar
