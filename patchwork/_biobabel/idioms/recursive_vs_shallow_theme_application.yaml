id: patchwork.recursive_vs_shallow_theme_application
name: Choose & (recursive) vs * (current level only) when restyling
description: >
  Both & and * apply a modifier to every plot in a composition, but * skips
  nested sub-patchworks entirely while & recurses into them too. Pick *
  when a nested sub-patchwork should keep its own distinct styling, and &
  when the whole tree (including nested compositions) should match.
code_template: |
  # p1, p2, p3, p4 are ggplot2_py.GGPlot objects; import patchwork as pw first.
  composed = p3 / (p1 | p2)
  everywhere = composed & theme_minimal()   # recurses: reaches p3, p1, and p2
  top_level_only = composed * theme_minimal()  # shallow: reaches p3, leaves the nested (p1 | p2) sub-patchwork untouched
typical_use_case: "Deciding whether a theme change should cascade into an already-styled nested sub-composition or leave it as-is."
applicable_to:
  - patchwork.operator_grammar
