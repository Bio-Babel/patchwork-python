mutates: "execution_class=builder; identical to patchworkGrob (same object); returns_kind=new_object."
returns: "gtable_py.Gtable — identical behavior to patchworkGrob."
requires: []
writes: []
examples:
  - "patchwork.patchwork_grob(p1 + p2)"
failure_fixes: []
related:
  - patchwork.patchworkGrob
